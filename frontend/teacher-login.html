<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecturer Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-role="teacher">
    <main class="container">
      <h1>Lecturer Login</h1>
      <p class="muted">Use your staff email or staff ID.</p>
      <form id="loginForm" class="card">
        <div id="loginLoading" class="loading-bar" role="status" aria-live="polite" aria-hidden="true">
          <span class="sr-only">Loading...</span>
          <div class="loading-bar__fill"></div>
        </div>
        <label><span id="identifierLabel">Staff Email/Staff ID</span>
          <input type="text" id="identifier" required placeholder="e.g., lecturer@uni.edu.ng or STAFF1001" />
        </label>
        <label>Password
          <div class="row" style="gap:0.5rem">
            <input type="password" id="password" required />
            <button type="button" id="togglePassword" class="button" style="padding:0.4rem 0.8rem">Show</button>
          </div>
        </label>
        <!-- <div id="forgotPasswordWrap" class="actions" style="justify-content:flex-end">
          <a id="forgotPasswordLink" class="button button-secondary" href="/forgot-password.html">Forgot password?</a>
        </div> -->
        <button type="submit">Log In</button>
        <p id="loginError" class="error" aria-live="polite"></p>
      </form>
    </main>
    <script src="js/config.js"></script>
    <script src="js/webauthn-helpers.js"></script>
    <script src="js/login.js"></script>
  </body>
  </html>
